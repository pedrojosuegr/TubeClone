<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeClone - Início</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/home.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1>TubeClone</h1>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="home.html">Início</a></li>
          <li><a href="channel.html">Meu canal</a></li>
          <li><a href="index.html">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="search-section" aria-labelledby="titulo-pesquisa">
      <h2 id="titulo-pesquisa">Pesquisar vídeos</h2>
      <form class="search-form" id="search-form" role="search">
        <div>
          <label for="busca">Pesquisar por título</label>
          <input type="search" id="busca" name="busca" placeholder="Digite um título...">
        </div>
        <button type="submit">Buscar</button>
      </form>
    </section>

    <section class="videos-section" aria-labelledby="titulo-videos">
      <h2 id="titulo-videos">Vídeos públicos</h2>

      <div class="video-grid" id="video-grid">
        <!-- Os vídeos são renderizados dinamicamente pelo js/home.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TubeClone</p>
  </footer>

</body>
</html>
