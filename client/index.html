<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeClone - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">

  <header class="site-header">
    <div class="header-inner">
      <h1>TubeClone</h1>
    </div>
  </header>

  <main class="page-main">
    <section class="login-card" aria-labelledby="titulo-login">
      <h2 id="titulo-login">Entrar</h2>

      <form id="login-form" novalidate>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email">
          <small class="field-error" id="erro-email"></small>
        </div>

        <div>
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha">
          <small class="field-error" id="erro-senha"></small>
        </div>

        <button type="submit">Entrar</button>
      </form>

      <p>Ainda não tem uma conta? <a href="#">Cadastre-se</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TubeClone</p>
  </footer>

</body>
</html>
