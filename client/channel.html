<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeClone - Meu canal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/channel.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1>TubeClone</h1>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="home.html">Início</a></li>
          <li><a href="channel.html">Meu canal</a></li>
          <li><a href="index.html">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="channel-info" aria-labelledby="titulo-canal">
      <h2 id="titulo-canal">Canal de Pedro</h2>
      <p>Canal de exemplo utilizado para apresentar os vídeos publicados pelo usuário.</p>
    </section>

    <section class="upload-section" aria-labelledby="titulo-upload">
      <h2 id="titulo-upload">Publicar novo vídeo</h2>

      <form class="upload-form" id="upload-form" novalidate>
        <div>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo">
          <small class="field-error" id="erro-titulo"></small>
        </div>

        <div>
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="4"></textarea>
        </div>

        <div>
          <label for="arquivo">Arquivo de vídeo</label>
          <input type="file" id="arquivo" name="arquivo" accept="video/*">
          <small class="field-error" id="erro-arquivo"></small>
        </div>

        <button type="submit">Publicar</button>
      </form>
    </section>

    <section class="videos-section" aria-labelledby="titulo-meus-videos">
      <h2 id="titulo-meus-videos">Meus vídeos</h2>

      <div class="video-grid" id="meus-videos-grid">
        <!-- Os vídeos são renderizados dinamicamente pelo js/channel.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TubeClone</p>
  </footer>

</body>
</html>
